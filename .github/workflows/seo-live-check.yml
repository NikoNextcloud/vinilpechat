name: SEO live smoke check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/seo-live-smoke-audit
      - main
    paths:
      - 'lib/seo-pages.js'
      - 'api/index.js'
      - 'vercel.json'
      - 'public/index.html'
      - 'public/robots.txt'
      - 'lib/stedman-page.js'
      - 'data/stedman-catalog.json'
      - 'public/teniski/**'
      - 'scripts/seo-live-smoke.cjs'
      - 'scripts/wait-for-production.cjs'
      - 'tests/**'
      - '.github/workflows/seo-live-check.yml'

permissions:
  contents: read

concurrency:
  group: seo-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm test

  live-smoke:
    needs: seo-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEO_BASE_URL: https://vinilpechat.vercel.app
      SEO_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Wait for this commit on the production domain
        run: node scripts/wait-for-production.cjs
      - name: Audit the published version
        run: node scripts/seo-live-smoke.cjs --full
