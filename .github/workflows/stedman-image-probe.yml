name: Inspect Stedman public photos
on:
  push:
    branches: [feature/stedman-shirts-configurator]
    paths:
      - '.github/workflows/stedman-image-probe.yml'
      - 'scripts/probe-stedman-images.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-stedman-images.mjs
